apply plugin: 'com.android.application'

android {
    namespace "com.lumeo.reader"
    compileSdk rootProject.ext.compileSdkVersion
    // Capacitor 7 and the Android Gradle Plugin are compiled with Java 21.
    // Keep the source/target level explicit so a system JDK 17 is never
    // silently selected for this project.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    defaultConfig {
        applicationId "com.lumeo.reader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Optional, controlled local experiment. OAuth client IDs are public identifiers;
            // do not put a client secret here. Release builds never use this override.
            def testWebClient = System.getenv('LUMEO_GOOGLE_TEST_WEB_CLIENT_ID')?.trim() ?: ''
            // Android's Gradle process does not load Vite's .env.local automatically.
            // Read just this public identifier for the debug-only experiment; .env.local is
            // gitignored and never copied to an Android resource as a whole.
            if (!testWebClient) {
                def localEnv = rootProject.file('../.env.local')
                if (localEnv.isFile()) {
                    def entry = localEnv.readLines().find { it ==~ /^\s*LUMEO_GOOGLE_TEST_WEB_CLIENT_ID\s*=.*$/ }
                    if (entry != null) testWebClient = entry.substring(entry.indexOf('=') + 1).trim().replaceAll(/^['"]|['"]$/, '')
                }
            }
            if (testWebClient && !(testWebClient ==~ /[A-Za-z0-9_-]+\.apps\.googleusercontent\.com/)) {
                throw new GradleException('LUMEO_GOOGLE_TEST_WEB_CLIENT_ID has an invalid format')
            }
            resValue 'string', 'lumeo_test_web_client_id', testWebClient
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // Official Google Identity authorization on Android. This keeps the consent
    // UI outside the app-controlled WebView.
    // 21.6.0 retains support for the app's existing minSdk 23. Do not raise
    // minSdk merely to add OAuth; the authorization API is available here.
    implementation "com.google.android.gms:play-services-auth:21.6.0"
    // The Lumeo account: Firebase Authentication, signed in with Google through Android's
    // own account picker (Credential Manager). Configured by google-services.json.
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    // MobileSAM executes entirely inside the app process. No model input, page,
    // embedding or mask leaves the device.
    // 1.20 keeps Android API 23 support. Newer 1.31 raises its manifest to API 24;
    // do not silently drop devices or override a runtime's declared minimum.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.20.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
